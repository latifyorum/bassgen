[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bassgen"
version = "0.1.0"
description = "Chord progression to bassline MIDI generator with genre presets (trap, rock, metal) and a local web UI"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["mido>=1.3"]

[project.scripts]
bassgen = "bassgen.cli:main"
bassgen-web = "bassgen.web:main"

[tool.setuptools]
packages = ["bassgen"]

[tool.setuptools.package-data]
bassgen = ["web_ui.html"]
